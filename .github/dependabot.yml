# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Updates are grouped so routine bumps arrive as one PR instead of a dozen conflicting ones.
# Reviewers come from .github/CODEOWNERS.
version: 2
updates:
 - package-ecosystem: npm
   directory: /
   schedule:
    interval: weekly
   groups:
    production:
     dependency-type: production
     update-types: [minor, patch]
    development:
     dependency-type: development
     update-types: [minor, patch]

 - package-ecosystem: github-actions
   directory: /
   schedule:
    interval: monthly
   groups:
    actions:
     patterns: ['*']
